name: Build and Release LeaveApp

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build LeaveApp
        shell: pwsh
        run: |
          pyinstaller --name LeaveApp --onedir --console `
            --add-data "app/templates;app/templates" `
            --add-data "app/static;app/static" `
            app.py

      - name: Copy configuration file
        shell: pwsh
        run: |
          Copy-Item config.json dist/LeaveApp/config.json

      - name: Verify packaged files
        shell: pwsh
        run: |
          if (!(Test-Path "dist/LeaveApp/app/templates/base.html")) {
            throw "Missing base.html!"
          }

          if (!(Test-Path "dist/LeaveApp/app/static/css/style.css")) {
            throw "Missing style.css!"
          }

          if (!(Test-Path "dist/LeaveApp/config.json")) {
            throw "Missing config.json!"
          }

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist/LeaveApp -DestinationPath dist/LeaveApp.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/LeaveApp.zip

name: Build and Release LeaveApp

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build LeaveApp
        run: |
          pyinstaller --name LeaveApp --onedir --console app.py

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist/LeaveApp -DestinationPath dist/LeaveApp.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/LeaveApp.zip

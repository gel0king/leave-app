<form method="post" action="{{ form_action }}" class="space-y-6">

    <!-- Employee Information -->
    <fieldset class="rounded-xl border border-gray-200 bg-white p-5 shadow-sm">
        <legend class="px-1 text-sm font-bold text-[#173f3a]">
            Employee Information
        </legend>
        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
            <!-- Employee Number -->
            <div class="flex flex-col gap-1.5">

                <label for="employee_number" class="text-xs font-semibold text-gray-600">
                    Employee #
                </label>

                <input id="employee_number" type="number" name="employee_number"
                    value="{{ employee.employee_number or '' }}" placeholder="e.g. 4378" required
                    class="w-full rounded-lg border border-gray-200 bg-gray-50 px-3 py-2.5 text-sm text-gray-700 outline-none transition focus:border-[#27836f] focus:bg-white focus:ring-2 focus:ring-[#27836f]/10" />
            </div>

            <!-- Name -->
            <div class="flex flex-col gap-1.5">
                <label for="name" class="text-xs font-semibold text-gray-600">
                    Name
                </label>
                <input id="name" type="text" name="name" value="{{ employee.name or '' }}" placeholder="Employee name"
                    required
                    class="w-full rounded-lg border border-gray-200 bg-gray-50 px-3 py-2.5 text-sm text-gray-700 outline-none transition focus:border-[#27836f] focus:bg-white focus:ring-2 focus:ring-[#27836f]/10" />
            </div>

            <!-- Office -->
            <div class="flex flex-col gap-1.5">
                <label for="office" class="text-xs font-semibold text-gray-600">
                    Office
                </label>
                <input id="office" type="text" name="office" value="{{ employee.office or '' }}" placeholder="Office"
                    class="w-full rounded-lg border border-gray-200 bg-gray-50 px-3 py-2.5 text-sm text-gray-700 outline-none transition focus:border-[#27836f] focus:bg-white focus:ring-2 focus:ring-[#27836f]/10" />

            </div>
        </div>
    </fieldset>

    <!-- Employment Information -->
    <fieldset class="rounded-xl border border-gray-200 bg-white p-5 shadow-sm">
        <legend class="px-1 text-sm font-bold text-[#173f3a]">
            Employment Information
        </legend>
        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">
            <!-- Start Date -->
            <div class="flex flex-col gap-1.5">
                <label for="start_date" class="text-xs font-semibold text-gray-600">
                    Start Date
                </label>
                <input id="start_date" type="date" name="start_date" value="{{ employee.start_date or '' }}" required
                    class="w-full rounded-lg border border-gray-200 bg-gray-50 px-3 py-2.5 text-sm text-gray-700 outline-none transition focus:border-[#27836f] focus:bg-white focus:ring-2 focus:ring-[#27836f]/10" />
            </div>
            <!-- Employment Date -->
            <div class="flex flex-col gap-1.5">
                <label for="employment_date" class="text-xs font-semibold text-gray-600">
                    FTE Date
                </label>
                <input id="employment_date" type="date" value="{{ employment_period.employment_date or '' }}"
                    name="employment_date"
                    class="w-full rounded-lg border border-gray-200 bg-gray-50 px-3 py-2.5 text-sm text-gray-700 outline-none transition focus:border-[#27836f] focus:bg-white focus:ring-2 focus:ring-[#27836f]/10" />
            </div>
            <!-- Probation End -->
            <div class="flex flex-col gap-1.5">
                <label for="probation_end_date" class="text-xs font-semibold text-gray-600">
                    Probation End Date
                </label>

                <input id="probation_end_date" type="date" value="{{ employment_period.probation_end_date or '' }}"
                    name="probation_end_date"
                    class="w-full rounded-lg border border-gray-200 bg-gray-50 px-3 py-2.5 text-sm text-gray-700 outline-none transition focus:border-[#27836f] focus:bg-white focus:ring-2 focus:ring-[#27836f]/10" />
            </div>
            <!-- Employment Status -->
            <div class="flex flex-col gap-1.5">
                <label for="employment_status" class="text-xs font-semibold text-gray-600">
                    Employment Status
                </label>

                <select id="employment_status" name="employment_status"
                    class="w-full rounded-lg border border-gray-200 bg-gray-50 px-3 py-2.5 text-sm text-gray-700 outline-none transition focus:border-[#27836f] focus:bg-white focus:ring-2 focus:ring-[#27836f]/10">
                    <option value="Seasonal" {% if employment_period.employment_status=="Seasonal" %}selected{% endif
                        %}>
                        Seasonal
                    </option>

                    <option value="Full Time" {% if employment_period.employment_status=="Full Time" %}selected{% endif
                        %}>
                        Full Time
                    </option>

                    <option value="Inactive" {% if employment_period.employment_status=="Inactive" %}selected{% endif
                        %}>
                        Inactive
                    </option>
                </select>
            </div>

        </div>

        <!-- Employment History -->
        <div class="mt-4 flex flex-col gap-1.5">

            <label for="employment_history" class="text-xs font-semibold text-gray-600">
                Employment History
            </label>

            <select id="employment_history" name="employment_history"
                class="w-full rounded-lg border border-gray-200 bg-gray-50 px-3 py-2.5 text-sm text-gray-700 outline-none transition focus:border-[#27836f] focus:bg-white focus:ring-2 focus:ring-[#27836f]/10 sm:max-w-md">
                <option value="New Hire" {% if employment_period and employment_period.employment_history=="New Hire"
                    %}selected{% endif %}>
                    New Hire
                </option>

                <option value="Retiree" {% if employment_period and employment_period.employment_history=="Retiree"
                    %}selected{% endif %}>
                    Retiree
                </option>

                <option value="Returning" {% if employment_period and employment_period.employment_history=="Returning"
                    %}selected{% endif %}>
                    Returning
                </option>
            </select>

        </div>

    </fieldset>


    <!-- Initial Leave Balances -->
    <fieldset class="rounded-xl border border-gray-200 bg-white p-5 shadow-sm">

        <legend class="px-1 text-sm font-bold text-[#173f3a]">
            Initial Leave Balances
        </legend>

        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">

            <!-- Annual Leave -->
            <div class="flex flex-col gap-1.5">

                <label for="annual_balance" class="text-xs font-semibold text-gray-600">
                    Annual Leave (hours)
                </label>

                <input id="annual_balance" type="number" step="0.5" min="0"
                    value="{{ employment_period.starting_annual_leave if employment_period else '0' }}"
                    name="annual_balance" required
                    class="w-full rounded-lg border border-gray-200 bg-gray-50 px-3 py-2.5 text-sm text-gray-700 outline-none transition focus:border-[#27836f] focus:bg-white focus:ring-2 focus:ring-[#27836f]/10" />

            </div>

            <!-- Sick Leave -->
            <div class="flex flex-col gap-1.5">

                <label for="sick_balance" class="text-xs font-semibold text-gray-600">
                    Sick Leave (hours)
                </label>

                <input id="sick_balance" type="number" step="0.5" min="0"
                    value="{{ employment_period.starting_sick_leave if employment_period else '0' }}"
                    name="sick_balance" required
                    class="w-full rounded-lg border border-gray-200 bg-gray-50 px-3 py-2.5 text-sm text-gray-700 outline-none transition focus:border-[#27836f] focus:bg-white focus:ring-2 focus:ring-[#27836f]/10" />

            </div>

            <!-- Leave Balance As Of -->
            <div class="flex flex-col gap-1.5">

                <label for="leave_balance_date" class="text-xs font-semibold text-gray-600">
                    Balance As Of
                </label>

                <input id="leave_balance_date" type="date"
                    value="{{ employment_period.leave_balance_date if employment_period and employment_period.leave_balance_date else (employment_period.employment_date if employment_period else '') }}"
                    name="leave_balance_date"
                    class="w-full rounded-lg border border-gray-200 bg-gray-50 px-3 py-2.5 text-sm text-gray-700 outline-none transition focus:border-[#27836f] focus:bg-white focus:ring-2 focus:ring-[#27836f]/10" />

            </div>

        </div>

    </fieldset>

    <!-- Personal Information -->
    <fieldset class="rounded-xl border border-gray-200 bg-white p-5 shadow-sm">
        <legend class="px-1 text-sm font-bold text-[#173f3a]">
            Personal Information
        </legend>

        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">

            <!-- SSN -->
            <div class="flex flex-col gap-1.5">
                <label for="ssn" class="text-xs font-semibold text-gray-600">
                    SSN
                </label>
                <input id="ssn" type="text" name="ssn" maxlength="11" value="{{ ssn or '' }}" placeholder="###-##-####"
                    autocomplete="off"
                    class="w-full rounded-lg border border-gray-200 bg-gray-50 px-3 py-2.5 text-sm text-gray-700 outline-none transition focus:border-[#27836f] focus:bg-white focus:ring-2 focus:ring-[#27836f]/10" />
            </div>

            <!-- Date of Birth -->
            <div class="flex flex-col gap-1.5">
                <label for="date_of_birth" class="text-xs font-semibold text-gray-600">
                    Date of Birth
                </label>
                <input id="date_of_birth" type="date" value="{{ date_of_birth or '' }}" name="date_of_birth"
                    class="w-full rounded-lg border border-gray-200 bg-gray-50 px-3 py-2.5 text-sm text-gray-700 outline-none transition focus:border-[#27836f] focus:bg-white focus:ring-2 focus:ring-[#27836f]/10" />
            </div>

            <!-- Insurance Expiration -->
            <div class="flex flex-col gap-1.5">
                <label for="insurance_expires" class="text-xs font-semibold text-gray-600">
                    Insurance Expires
                </label>
                <input id="insurance_expires" type="date" value="{{ employee.insurance_expires or '' }}"
                    name="insurance_expires"
                    class="w-full rounded-lg border border-gray-200 bg-gray-50 px-3 py-2.5 text-sm text-gray-700 outline-none transition focus:border-[#27836f] focus:bg-white focus:ring-2 focus:ring-[#27836f]/10" />
            </div>

        </div>
    </fieldset>

    <!-- Identification -->
    <fieldset class="rounded-xl border border-gray-200 bg-white p-5 shadow-sm">

        <legend class="px-1 text-sm font-bold text-[#173f3a]">
            Identification
        </legend>

        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">

            <!-- Driver License State -->
            <div class="flex flex-col gap-1.5">

                <label for="driver_license_state" class="text-xs font-semibold text-gray-600">
                    DL State
                </label>

                <input id="driver_license_state" type="text" value="{{ employee.driver_license_state or '' }}"
                    name="driver_license_state" maxlength="2" placeholder="TX"
                    class="w-full rounded-lg border border-gray-200 bg-gray-50 px-3 py-2.5 text-sm uppercase text-gray-700 outline-none transition focus:border-[#27836f] focus:bg-white focus:ring-2 focus:ring-[#27836f]/10" />

            </div>

            <!-- License Number -->
            <div class="flex flex-col gap-1.5">

                <label for="license_number" class="text-xs font-semibold text-gray-600">
                    License Number
                </label>

                <input id="license_number" type="text" value="{{ license_number or '' }}" name="license_number"
                    class="w-full rounded-lg border border-gray-200 bg-gray-50 px-3 py-2.5 text-sm text-gray-700 outline-none transition focus:border-[#27836f] focus:bg-white focus:ring-2 focus:ring-[#27836f]/10" />

            </div>

            <!-- License Expiration -->
            <div class="flex flex-col gap-1.5">

                <label for="driver_license_expire_date" class="text-xs font-semibold text-gray-600">
                    DL Expiration
                </label>

                <input id="driver_license_expire_date" type="date"
                    value="{{ employee.driver_license_expire_date or '' }}" name="driver_license_expire_date"
                    class="w-full rounded-lg border border-gray-200 bg-gray-50 px-3 py-2.5 text-sm text-gray-700 outline-none transition focus:border-[#27836f] focus:bg-white focus:ring-2 focus:ring-[#27836f]/10" />

            </div>

            <!-- Other ID -->
            <div class="flex flex-col gap-1.5">

                <label for="other_id" class="text-xs font-semibold text-gray-600">
                    Other ID
                </label>

                <input id="other_id" type="text" name="other_id" value="{{ employee.other_id or '' }}"
                    placeholder="ID type"
                    class="w-full rounded-lg border border-gray-200 bg-gray-50 px-3 py-2.5 text-sm text-gray-700 outline-none transition focus:border-[#27836f] focus:bg-white focus:ring-2 focus:ring-[#27836f]/10" />

            </div>

            <!-- Other ID Number -->
            <div class="flex flex-col gap-1.5">

                <label for="other_id_number" class="text-xs font-semibold text-gray-600">
                    Other ID Number
                </label>

                <input id="other_id_number" type="text" value="{{ other_id_number or '' }}" name="other_id_number"
                    class="w-full rounded-lg border border-gray-200 bg-gray-50 px-3 py-2.5 text-sm text-gray-700 outline-none transition focus:border-[#27836f] focus:bg-white focus:ring-2 focus:ring-[#27836f]/10" />

            </div>

        </div>

    </fieldset>

    <!-- Address -->
    <fieldset class="rounded-xl border border-gray-200 bg-white p-5 shadow-sm">
        <legend class="px-1 text-sm font-bold text-[#173f3a]">
            Address
        </legend>

        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">

            <!-- Address -->
            <div class="flex flex-col gap-1.5 lg:col-span-2">
                <label for="address" class="text-xs font-semibold text-gray-600">
                    Address
                </label>
                <input id="address" type="text" name="address" value="{{ address or '' }}" placeholder="Street address"
                    class="w-full rounded-lg border border-gray-200 bg-gray-50 px-3 py-2.5 text-sm text-gray-700 outline-none transition focus:border-[#27836f] focus:bg-white focus:ring-2 focus:ring-[#27836f]/10" />
            </div>

            <!-- City -->
            <div class="flex flex-col gap-1.5">
                <label for="city" class="text-xs font-semibold text-gray-600">
                    City
                </label>
                <input id="city" type="text" name="city" value="{{ employee.city or '' }}"
                    class="w-full rounded-lg border border-gray-200 bg-gray-50 px-3 py-2.5 text-sm text-gray-700 outline-none transition focus:border-[#27836f] focus:bg-white focus:ring-2 focus:ring-[#27836f]/10" />
            </div>

            <!-- State -->
            <div class="flex flex-col gap-1.5">
                <label for="state" class="text-xs font-semibold text-gray-600">
                    State
                </label>
                <input id="state" type="text" name="state" maxlength="2" value="{{ employee.state or '' }}"
                    placeholder="TX"
                    class="w-full rounded-lg border border-gray-200 bg-gray-50 px-3 py-2.5 text-sm uppercase text-gray-700 outline-none transition focus:border-[#27836f] focus:bg-white focus:ring-2 focus:ring-[#27836f]/10" />
            </div>

            <!-- ZIP -->
            <div class="flex flex-col gap-1.5">
                <label for="zip" class="text-xs font-semibold text-gray-600">
                    ZIP
                </label>
                <input id="zip" type="text" name="zip" maxlength="10" value="{{ employee.zip or '' }}" placeholder="ZIP"
                    class="w-full rounded-lg border border-gray-200 bg-gray-50 px-3 py-2.5 text-sm text-gray-700 outline-none transition focus:border-[#27836f] focus:bg-white focus:ring-2 focus:ring-[#27836f]/10" />
            </div>

        </div>
    </fieldset>

    <!-- Departure / Return -->
    <fieldset class="rounded-xl border border-gray-200 bg-white p-5 shadow-sm">
        <legend class="px-1 text-sm font-bold text-[#173f3a]">
            Departure / Return
        </legend>

        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">

            <!-- Departure Date -->
            <div class="flex flex-col gap-1.5">
                <label for="departure_date" class="text-xs font-semibold text-gray-600">
                    Departure Date
                </label>
                <input id="departure_date" type="date"
                    value="{{ employment_period.departure_date if employment_period else '' }}" name="departure_date"
                    class="w-full rounded-lg border border-gray-200 bg-gray-50 px-3 py-2.5 text-sm text-gray-700 outline-none transition focus:border-[#27836f] focus:bg-white focus:ring-2 focus:ring-[#27836f]/10" />
            </div>

            <!-- Return Date -->
            <div class="flex flex-col gap-1.5">
                <label for="return_date" class="text-xs font-semibold text-gray-600">
                    Return Date
                </label>
                <input id="return_date" type="date"
                    value="{{ employment_period.return_date if employment_period else '' }}" name="return_date"
                    class="w-full rounded-lg border border-gray-200 bg-gray-50 px-3 py-2.5 text-sm text-gray-700 outline-none transition focus:border-[#27836f] focus:bg-white focus:ring-2 focus:ring-[#27836f]/10" />
            </div>

        </div>
    </fieldset>

    <!-- Actions -->
    <div class="flex flex-wrap items-center gap-3 border-t border-gray-200 pt-5">
        <button type="submit"
            class="inline-flex items-center justify-center rounded-lg bg-[#173f3a] px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition-all duration-200 hover:bg-[#27836f] hover:shadow-md focus:outline-none focus:ring-2 focus:ring-[#27836f] focus:ring-offset-2">
            {{ submit_text }}
        </button>

        <a href="{{ url_for('employees.employees') }}"
            class="inline-flex items-center justify-center rounded-lg border border-gray-200 bg-gray-100 px-5 py-2.5 text-sm font-semibold text-gray-700 no-underline transition-all duration-200 hover:border-gray-300 hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-gray-300 focus:ring-offset-2">
            Cancel
        </a>
    </div>
</form>

<script>
    // Automatically set probation end date to 6 months after start date.
    document
        .getElementById("employment_date")
        .addEventListener("change", function () {
            const probationEndInput = document.getElementById("probation_end_date");

            if (!probationEndInput.value && this.value) {
                const [year, month, day] = this.value.split("-").map(Number);

                let newMonth = (month - 1) + 6;
                const newYear = year + Math.floor(newMonth / 12);
                newMonth = newMonth % 12;

                const yyyy = newYear;
                const mm = String(newMonth + 1).padStart(2, "0");
                const dd = String(day).padStart(2, "0");

                probationEndInput.value = `${yyyy}-${mm}-${dd}`;
            }
        });

    // Format SSN as ###-##-####
    document.getElementById("ssn").addEventListener("input", function () {
        let value = this.value.replace(/\D/g, "").slice(0, 9);

        if (value.length > 5) {
            value = value.slice(0, 3) + "-" + value.slice(3, 5) + "-" + value.slice(5);
        } else if (value.length > 3) {
            value = value.slice(0, 3) + "-" + value.slice(3);
        }

        this.value = value;
    });

    // Automatically uppercase state abbreviations.
    ["driver_license_state", "state"].forEach(id => {
        document.getElementById(id).addEventListener("input", function () {
            this.value = this.value.toUpperCase();
        });
    });
</script>

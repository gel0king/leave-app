{% extends "base.html" %} {% block content %}

<div class="bg-white rounded-lg p-6 shadow-sm">
    <h2 class="text-2xl font-semibold text-[#1e3f3d] mb-6">Add New Employee</h2>
    <form method="post" action="{{ url_for('employees.add_employee_submit') }}">
        <!-- Employee Information -->
        <fieldset class="mb-6">
            <legend
                class="font-bold text-[#1e3f3d] pb-2 mb-4 border-b border-gray-200"
            >
                Employee Information
            </legend>
            <div class="space-y-4">
                <label class="block">
                    <span class="text-gray-700 text-sm font-medium"
                        >Employee #</span
                    >
                    <input
                        type="text"
                        name="employee_number"
                        placeholder="e.g. 4378"
                        required
                        class="mt-2 w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-[#1e3f3d]"
                    />
                </label>
                <label class="block">
                    <span class="text-gray-700 text-sm font-medium">Name</span>
                    <input
                        type="text"
                        name="name"
                        required
                        class="mt-2 w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-[#1e3f3d]"
                    />
                </label>
                <label class="block">
                    <span class="text-gray-700 text-sm font-medium"
                        >Office</span
                    >
                    <input
                        type="text"
                        name="department"
                        class="mt-2 w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-[#1e3f3d]"
                    />
                </label>
            </div>
        </fieldset>

        <!-- Employment Dates -->
        <fieldset class="mb-6">
            <legend
                class="font-bold text-[#1e3f3d] pb-2 mb-4 border-b border-gray-200"
            >
                Employment Dates
            </legend>
            <div class="space-y-4">
                <label class="block">
                    <span class="text-gray-700 text-sm font-medium"
                        >Start Date</span
                    >
                    <input
                        type="date"
                        name="start_date"
                        id="start_date"
                        required
                        class="mt-2 w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-[#1e3f3d]"
                    />
                </label>
                <label class="block">
                    <span class="text-gray-700 text-sm font-medium"
                        >FTE Start Date</span
                    >
                    <input
                        type="date"
                        name="fte_start_date"
                        id="fte_start_date"
                        required
                        class="mt-2 w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-[#1e3f3d]"
                    />
                </label>
                <label class="block">
                    <span class="text-gray-700 text-sm font-medium"
                        >Probation End Date</span
                    >
                    <input
                        type="date"
                        name="probation_end"
                        id="probation_end"
                        class="mt-2 w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-[#1e3f3d]"
                    />
                    <p class="text-xs text-gray-600 italic mt-1">
                        Automatically set to 6 months after start date. Set new
                        date if needed.
                    </p>
                </label>
            </div>
        </fieldset>

        <!-- Employment History -->
        <fieldset class="mb-6">
            <legend
                class="font-bold text-[#1e3f3d] pb-2 mb-4 border-b border-gray-200"
            >
                Employment History
            </legend>
            <div class="space-y-4">
                <label class="block">
                    <span class="text-gray-700 text-sm font-medium"
                        >Start Date</span
                    >
                    <input
                        type="Text"
                        name="start_date"
                        id="start_date"
                        required
                        class="mt-2 w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-[#1e3f3d]"
                    />
                </label>
                <select
                    id="employee_hire_type_id"
                    name="employee_hire_type_id"
                    required
                    class="mt-2 w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-[#1e3f3d]"
                >
                    {% for h in history %}
                    <option value="{{ h.id }}">{{h.type}}</option>
                    {% endfor %}
                </select>
            </div>
        </fieldset>

        <!-- Initial Leave Balances -->
        <fieldset class="mb-6">
            <legend
                class="font-bold text-[#1e3f3d] pb-2 mb-4 border-b border-gray-200"
            >
                Initial Leave Balances (optional)
            </legend>
            <div class="space-y-4">
                <label class="block">
                    <span class="text-gray-700 text-sm font-medium"
                        >Annual Balance</span
                    >
                    <input
                        type="number"
                        step="0.5"
                        name="annual_balance"
                        placeholder="0"
                        class="mt-2 w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-[#1e3f3d]"
                    />
                </label>
                <label class="block">
                    <span class="text-gray-700 text-sm font-medium"
                        >Sick Balance</span
                    >
                    <input
                        type="number"
                        step="0.5"
                        name="sick_balance"
                        placeholder="0"
                        class="mt-2 w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-[#1e3f3d]"
                    />
                </label>
            </div>
        </fieldset>

        <div class="flex gap-3 mt-8">
            <button
                type="submit"
                class="px-5 py-2 bg-[#1e3f3d] text-white rounded-md text-sm font-medium hover:bg-[#16302d] transition-colors"
            >
                Add Employee
            </button>
            <a
                href="{{ url_for('employees.employees') }}"
                class="px-5 py-2 bg-gray-300 text-gray-800 rounded-md text-sm font-medium hover:bg-gray-400 transition-colors no-underline"
                >Cancel</a
            >
        </div>
    </form>
</div>

<script>
    document
        .getElementById("fte_start_date")
        .addEventListener("change", function () {
            const probationEndInput = document.getElementById("probation_end");

            // Only calculate if the probation end date is empty
            if (!probationEndInput.value) {
                const startDate = new Date(this.value);
                if (!isNaN(startDate.getTime())) {
                    // Add 6 months to the start date
                    const probationEnd = new Date(startDate);
                    probationEnd.setMonth(probationEnd.getMonth() + 6);

                    // Format as YYYY-MM-DD
                    const year = probationEnd.getFullYear();
                    const month = String(probationEnd.getMonth() + 1).padStart(
                        2,
                        "0",
                    );
                    const day = String(probationEnd.getDate()).padStart(2, "0");

                    probationEndInput.value = `${year}-${month}-${day}`;
                }
            }
        });
</script>

{% endblock %}
